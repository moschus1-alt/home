<!DOCTYPE html>
<html lang="ko">
<head>

<title>Lingua Vocab</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#20242d;--muted:#707785;--p:#5b5bd6;--line:#e5e7eb;--good:#16a34a;--bad:#dc2626;--shadow:0 10px 28px rgba(20,25,35,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;padding:18px}.hidden{display:none!important}.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.hero-card{width:min(760px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow);text-align:center}.lang-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.lang-btn{border:1px solid var(--line);background:#fff;border-radius:20px;padding:24px 14px;font-weight:900;font-size:18px}.lang-btn:hover{border-color:var(--p);transform:translateY(-1px)}.flag{font-size:40px;display:block;margin-bottom:8px}header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:16px}.brand h1{margin:0;font-size:28px}.brand p{margin:5px 0 0;color:var(--muted)}.streak{padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);font-weight:800;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:15px}.tab{background:#fff;border:1px solid var(--line);padding:11px;border-radius:12px;font-weight:800;color:#525866}.tab.active{background:var(--p);border-color:var(--p);color:#fff}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:19px;box-shadow:var(--shadow);margin-bottom:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.stat{padding:17px;background:#fff;border:1px solid var(--line);border-radius:17px}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:27px;margin-top:4px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}.field label{font-size:13px;color:var(--muted);font-weight:800}input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px}textarea{min-height:70px}.primary{border:0;background:var(--p);color:#fff;border-radius:12px;padding:12px 16px;font-weight:800}.secondary{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-weight:800}.danger{border:1px solid #f4b8b8;background:#fff;color:var(--bad);border-radius:10px;padding:8px 10px}.info{background:#eef2ff;border:1px solid #dfe3ff;border-radius:14px;padding:12px 14px;color:#444b77;font-size:14px}.warning{background:#fff8e7;border:1px solid #fde7a7;border-radius:14px;padding:12px 14px;color:#7a5707;font-size:14px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#504bc5;font-size:12px;font-weight:800}.muted{color:var(--muted)}.small{font-size:13px;color:var(--muted)}.center{text-align:center}.word-list{display:flex;flex-direction:column;gap:8px}.word-item{display:grid;grid-template-columns:1.1fr 1fr 1.3fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:14px}.flash-wrap{perspective:1000px}.flash{height:260px;position:relative;transform-style:preserve-3d;transition:.5s}.flash.flipped{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;box-shadow:var(--shadow)}.back{transform:rotateY(180deg)}.big{font-size:40px;font-weight:900}.meaning{font-size:27px;font-weight:900}.progress{height:9px;background:#e5e7eb;border-radius:50px;overflow:hidden;margin-bottom:13px}.progress>div{height:100%;background:var(--p)}.question{font-size:34px;font-weight:900;margin:15px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{padding:14px;border:1px solid var(--line);background:#fff;border-radius:13px;font-weight:800}.choice.correct{background:#e5f8eb;border-color:#9bdbae}.choice.wrong{background:#fdeaea;border-color:#efadad}.feedback{min-height:28px;margin-top:12px;font-weight:900}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:13px}@media(max-width:720px){.app{padding:11px}.lang-grid{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}.grid3{grid-template-columns:1fr}.word-item{grid-template-columns:1fr auto}.hide-mobile{display:none}.choices{grid-template-columns:1fr}.big{font-size:33px}.question{font-size:29px}}
.pronunciation{display:inline-flex;gap:6px;margin:8px 0;flex-wrap:wrap}.pronunciation button{padding:8px 10px;font-size:14px}#speechStatus{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;background:#20242d;color:#fff;border-radius:12px;padding:10px 16px;max-width:90%;text-align:center}#speechStatus:empty{display:none}</style></head><body><div id="languageGate" class="hero"><div class="hero-card"><div style="font-size:44px">🌍</div><h1 style="margin:8px 0 0">Lingua Vocab</h1><p class="muted">학습할 언어를 선택하세요.</p><div class="lang-grid"><button class="lang-btn" onclick="selectLanguage('es')"><span class="flag">🇪🇸</span>스페인어</button><button class="lang-btn" onclick="selectLanguage('ja')"><span class="flag">🇯🇵</span>일본어</button><button class="lang-btn" onclick="selectLanguage('zh')"><span class="flag">🇨🇳</span>중국어</button></div></div></div><div id="mainApp" class="app hidden"><header><div class="brand"><h1 id="brandTitle">Lingua Vocab</h1><p id="brandSub">단어 복습 · 간격 반복</p></div><div class="streak">🔥 <span id="streak">1</span>일 연속</div></header><nav class="tabs"><button class="tab active" data-tab="home">오늘</button><button class="tab" data-tab="duo">듀오링고</button><button class="tab" data-tab="words">단어장</button><button class="tab" data-tab="study">학습</button><button class="tab" data-tab="stats">통계</button><button class="tab" data-tab="settings">설정</button></nav><section id="home" class="panel active"><div class="grid3"><div class="stat"><span>전체 단어</span><b id="totalWords">0</b></div><div class="stat"><span>오늘 복습</span><b id="dueWords">0</b></div><div class="stat"><span>어려운 단어</span><b id="hardWords">0</b></div></div><div class="card center" style="margin-top:14px"><h2>오늘의 복습</h2><p class="muted">복습 예정 단어와 많이 틀린 단어를 우선 출제합니다.</p><button class="primary" onclick="startStudy('mixed')">복습 시작</button></div><div class="card"><h3>현재 듀오링고 진도</h3><div id="progressText" style="font-size:20px;font-weight:900">Section 1 · Unit 1</div><p class="muted" id="progressTopic"></p><button class="secondary" onclick="switchTab('duo')">진도/단어팩 관리</button></div></section><section id="duo" class="panel"><div class="card"><h2>🦉 듀오링고 단어 가져오기</h2><div class="info" id="duoInfo"></div><div class="row" style="margin-top:14px"><div class="field"><label>Section</label><select id="sectionSel" onchange="populateUnits()"></select></div><div class="field"><label>Unit</label><select id="unitSel" onchange="showUnit()"></select></div></div><div id="unitInfo" style="margin-top:14px"></div><div class="row" style="margin-top:14px"><button class="primary" onclick="importSelected()">이 Unit 단어 추가</button><button class="secondary" onclick="saveProgress()">현재 진도로 저장</button><button class="secondary" onclick="importToHere()">여기까지 전부 추가</button></div><div id="importMsg" style="margin-top:12px"></div></div></section><section id="words" class="panel"><div class="card"><h2>단어 직접 추가</h2><div class="row"><div class="field"><label id="targetLabel">학습 언어</label><input id="targetWord"></div><div class="field"><label>한국어 뜻</label><input id="koWord"></div><div class="field"><label>품사</label><select id="pos"><option>단어</option><option>명사</option><option>동사</option><option>형용사</option><option>표현</option></select></div></div><div class="field" style="margin-top:9px"><label>예문 / 메모</label><textarea id="example"></textarea></div><button class="primary" style="margin-top:10px" onclick="addWord()">저장</button></div><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">내 단어장</h2><input id="search" placeholder="검색" oninput="renderWords()" style="max-width:230px"></div><div id="wordList" class="word-list" style="margin-top:13px"></div></div></section><section id="study" class="panel"><div class="card"><div class="row"><button class="secondary" onclick="startStudy('flash')">플래시카드</button><button class="secondary" onclick="startStudy('choice')">객관식</button><button class="secondary" onclick="startStudy('typing')">직접입력</button><button class="primary" onclick="startStudy('mixed')">혼합복습</button></div></div><div id="studyArea"><div class="card center"><h3>학습 모드를 선택하세요.</h3></div></div></section><section id="stats" class="panel"><div class="grid3"><div class="stat"><span>총 정답</span><b id="correctCount">0</b></div><div class="stat"><span>총 오답</span><b id="wrongCount">0</b></div><div class="stat"><span>정답률</span><b id="accuracy">0%</b></div></div><div class="card" style="margin-top:14px"><h2>취약 단어 TOP 10</h2><table><thead><tr><th>단어</th><th>뜻</th><th>오답</th><th>정답</th></tr></thead><tbody id="weakTable"></tbody></table></div></section><section id="settings" class="panel"><div class="card"><h2>설정</h2><p class="muted">언어별 단어장과 학습 기록은 서로 분리되어 저장됩니다.</p><button class="secondary" onclick="changeLanguage()">학습 언어 바꾸기</button></div></section></div><div id="speechStatus" role="status" aria-live="polite"></div><script>
const LANGS={es:{name:'스페인어',flag:'🇪🇸',label:'스페인어',sections:8,counts:{1:10,2:31,3:30,4:60,5:250,6:250,7:180,8:180},topics:{1:['카페에서 주문하기','인사하고 작별 인사하기','출신지 말하기','가족과 친구 소개하기','성격 묘사하기','위치 말하기','도시의 장소','언어 이야기','날씨 표현','과일 사기']}},ja:{name:'일본어',flag:'🇯🇵',label:'일본어',sections:5,counts:{1:10,2:20,3:30,4:40,5:50},topics:{1:['기본 인사','자기소개','음식과 음료','가족','숫자','시간','장소','쇼핑','날씨','취미']}},zh:{name:'중국어',flag:'🇨🇳',label:'중국어',sections:5,counts:{1:10,2:20,3:30,4:40,5:50},topics:{1:['기본 인사','자기소개','음식과 음료','가족','숫자','시간','장소','쇼핑','날씨','취미']}}};
const PACKS={es:{'1-1':[['un vaso de agua','물 한 잔','표현'],['por favor','부탁합니다','표현'],['hola','안녕하세요','표현'],['quiero','나는 원해요','동사'],['el té','차','명사'],['el azúcar','설탕','명사'],['el helado','아이스크림','명사'],['el café','커피','명사'],['el sándwich','샌드위치','명사'],['el agua','물','명사']], '1-2':[['buenos días','좋은 아침입니다','표현'],['yo soy','나는 ~입니다','표현'],['mucho gusto','만나서 반갑습니다','표현'],['¿qué tal?','어떻게 지내요?','표현'],['hasta luego','나중에 봐요','표현'],['adiós','안녕히 가세요','표현'],['buenas noches','좋은 저녁 / 안녕히 주무세요','표현']]},ja:{'1-1':[['こんにちは','안녕하세요','표현'],['おはよう','좋은 아침','표현'],['こんばんは','안녕하세요(저녁)','표현'],['ありがとう','고마워요','표현'],['はい','네','단어'],['いいえ','아니요','단어']], '1-2':[['わたし','나 / 저','명사'],['なまえ','이름','명사'],['がくせい','학생','명사'],['せんせい','선생님','명사'],['です','~입니다','표현'],['よろしく','잘 부탁합니다','표현']]},zh:{'1-1':[['你好','안녕하세요','표현'],['早上好','좋은 아침입니다','표현'],['晚上好','안녕하세요(저녁)','표현'],['谢谢','감사합니다','표현'],['是','~이다 / 맞다','동사'],['不','아니다 / ~하지 않다','단어']], '1-2':[['我','나 / 저','대명사'],['你','너 / 당신','대명사'],['名字','이름','명사'],['学生','학생','명사'],['老师','선생님','명사'],['很高兴认识你','만나서 반갑습니다','표현']]}};
let lang=localStorage.getItem('lingua_selected_language')||null,words=[],stats={},progress={},session=[],current=0,mode='mixed',answered=false;

let activeSpeech=null,speechNoticeTimer,speechStartTimer;
function speechNotice(message){const el=document.getElementById('speechStatus');el.textContent=message;clearTimeout(speechNoticeTimer);if(message)speechNoticeTimer=setTimeout(()=>{el.textContent=''},4500)}
function stopPronunciation(){clearTimeout(speechStartTimer);activeSpeech=null;if('speechSynthesis' in window)window.speechSynthesis.cancel();speechNotice('')}
function pronounceWord(id,slow=false){
 const w=words.find(word=>word.id===id);if(!w)return;
 stopPronunciation();
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){speechNotice('이 브라우저에서는 발음을 지원하지 않습니다. Chrome 또는 Edge에서 이용해 주세요.');return}
 const locale={es:'es-ES',ja:'ja-JP',zh:'zh-CN'}[lang];
 const utterance=new SpeechSynthesisUtterance(w.target);utterance.lang=locale;utterance.rate=slow?0.65:0.9;
 const voices=window.speechSynthesis.getVoices();
 const voice=voices.find(v=>v.lang.toLowerCase()===locale.toLowerCase())||voices.find(v=>v.lang.toLowerCase().startsWith(lang+'-')||v.lang===lang);
 if(voice)utterance.voice=voice;
 activeSpeech=utterance;
 utterance.onstart=()=>{if(activeSpeech===utterance){clearTimeout(speechStartTimer);speechNotice(slow?'천천히 읽는 중…':'발음 재생 중…')}};
 utterance.onend=()=>{if(activeSpeech===utterance){clearTimeout(speechStartTimer);activeSpeech=null;speechNotice('')}};
 utterance.onerror=()=>{if(activeSpeech===utterance){clearTimeout(speechStartTimer);activeSpeech=null;speechNotice('발음을 재생하지 못했습니다. 기기의 해당 언어 음성 설정을 확인해 주세요.')}};
 speechStartTimer=setTimeout(()=>{if(activeSpeech===utterance){stopPronunciation();speechNotice('음성을 시작하지 못했습니다. 기기의 해당 언어 음성 설정을 확인하거나 다른 브라우저에서 이용해 주세요.')}},5000);
 try{window.speechSynthesis.speak(utterance)}catch(e){activeSpeech=null;speechNotice('발음을 재생하지 못했습니다. 잠시 후 다시 눌러 주세요.')}
}
function pronunciationButtons(w){return `<div class="pronunciation"><button class="secondary" onclick="event.stopPropagation();pronounceWord(${w.id})" aria-label="발음 듣기">🔊 발음</button><button class="secondary" onclick="event.stopPropagation();pronounceWord(${w.id},true)" aria-label="천천히 발음 듣기">🐢 천천히</button></div>`}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPronunciation()});
window.addEventListener('pagehide',stopPronunciation);

function keyBase(){return 'lingua_'+lang+'_'}function loadState(){words=JSON.parse(localStorage.getItem(keyBase()+'words')||'[]');stats=JSON.parse(localStorage.getItem(keyBase()+'stats')||'{"correct":0,"wrong":0,"lastStudy":null,"streak":1}');progress=JSON.parse(localStorage.getItem(keyBase()+'progress')||'{"section":1,"unit":1}')}function saveState(){localStorage.setItem(keyBase()+'words',JSON.stringify(words));localStorage.setItem(keyBase()+'stats',JSON.stringify(stats));localStorage.setItem(keyBase()+'progress',JSON.stringify(progress))}function selectLanguage(code){stopPronunciation();lang=code;localStorage.setItem('lingua_selected_language',code);loadState();languageGate.classList.add('hidden');mainApp.classList.remove('hidden');applyLanguageUI();initSelectors();renderProgress();renderWords();renderStats()}function changeLanguage(){stopPronunciation();mainApp.classList.add('hidden');languageGate.classList.remove('hidden')}function applyLanguageUI(){const L=LANGS[lang];brandTitle.textContent=`${L.flag} ${L.name} Vocab`;brandSub.textContent=`${L.name} 단어 복습 · 간격 반복`;targetLabel.textContent=L.label;targetWord.placeholder=lang==='es'?'예: la casa':lang==='ja'?'예: こんにちは':'예: 你好';duoInfo.textContent=lang==='es'?'스페인어는 Section/Unit 진도 저장과 일부 검증 단어팩을 제공합니다.':'일본어/중국어는 언어별 단어장과 학습 기능을 완전히 분리하며, 현재는 초기 단어팩부터 제공됩니다.'}function topic(s,u){return (LANGS[lang].topics[s]||[])[u-1]||`Unit ${u}`}function initSelectors(){sectionSel.innerHTML='';for(let s=1;s<=LANGS[lang].sections;s++)sectionSel.innerHTML+=`<option value="${s}">Section ${s}</option>`;sectionSel.value=Math.min(progress.section,LANGS[lang].sections);populateUnits(progress.unit)}function populateUnits(preferred){const s=+sectionSel.value,cnt=LANGS[lang].counts[s]||10;unitSel.innerHTML='';for(let u=1;u<=cnt;u++)unitSel.innerHTML+=`<option value="${u}">Unit ${u} · ${esc(topic(s,u))}</option>`;unitSel.value=Math.min(preferred||1,cnt);showUnit()}function showUnit(){const s=+sectionSel.value,u=+unitSel.value,p=(PACKS[lang]||{})[`${s}-${u}`];unitInfo.innerHTML=`<div style="font-size:20px;font-weight:900">Section ${s} · Unit ${u}</div><div class="small">${esc(topic(s,u))}</div><p>${p?`내장 단어팩 <b>${p.length}개</b> 사용 가능`:'현재 이 Unit의 내장 단어팩은 없습니다.'}</p>`}function addWordObj(target,ko,pos='단어',example='',source='manual'){target=target.trim();ko=ko.trim();if(!target||!ko)return false;if(words.some(w=>w.target.toLowerCase()===target.toLowerCase()))return false;words.push({id:Date.now()+Math.random(),target,ko,pos,example,source,correct:0,wrong:0,level:0,nextReview:new Date().toISOString()});return true}function importSelected(){const s=+sectionSel.value,u=+unitSel.value,p=(PACKS[lang]||{})[`${s}-${u}`];if(!p){importMsg.innerHTML='<div class="warning">이 Unit은 아직 내장 단어팩이 없습니다. 진도 저장은 가능합니다.</div>';return}let n=0;p.forEach(x=>{if(addWordObj(x[0],x[1],x[2],'',`Duolingo S${s}U${u}`))n++});save();importMsg.innerHTML=`<div class="info">새 단어 <b>${n}개</b>를 추가했습니다.</div>`}function importToHere(){const ts=+sectionSel.value,tu=+unitSel.value;let added=0,available=0;for(let s=1;s<=ts;s++){let max=s===ts?tu:(LANGS[lang].counts[s]||10);for(let u=1;u<=max;u++){let p=(PACKS[lang]||{})[`${s}-${u}`];if(p){available++;p.forEach(x=>{if(addWordObj(x[0],x[1],x[2],'',`Duolingo S${s}U${u}`))added++})}}}save();importMsg.innerHTML=`<div class="info">현재 위치까지 내장된 ${available}개 Unit에서 새 단어 <b>${added}개</b>를 추가했습니다.</div>`}function saveProgress(){progress={section:+sectionSel.value,unit:+unitSel.value};saveState();renderProgress();importMsg.innerHTML='<div class="info">현재 진도를 저장했습니다.</div>'}function renderProgress(){progressText.textContent=`Section ${progress.section} · Unit ${progress.unit}`;progressTopic.textContent=topic(progress.section,progress.unit)}function addWord(){if(!targetWord.value.trim()||!koWord.value.trim()){alert('단어와 뜻을 입력하세요.');return}addWordObj(targetWord.value,koWord.value,pos.value,example.value);targetWord.value='';koWord.value='';example.value='';save()}function deleteWord(id){words=words.filter(w=>w.id!==id);save()}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderWords(){let q=(search?.value||'').toLowerCase(),f=words.filter(w=>w.target.toLowerCase().includes(q)||w.ko.toLowerCase().includes(q));wordList.innerHTML=f.length?f.map(w=>`<div class="word-item"><div><b>${esc(w.target)}</b><br>${pronunciationButtons(w)}<br><span class="badge">${esc(w.pos)}</span></div><div>${esc(w.ko)}</div><div class="hide-mobile small">${esc(w.source||'직접 추가')}</div><button class="danger" onclick="deleteWord(${w.id})">삭제</button></div>`).join(''):'<p class="muted">아직 단어가 없습니다.</p>'}function due(w){return !w.nextReview||new Date(w.nextReview)<=new Date()}function hard(w){return (w.wrong||0)>(w.correct||0)}function renderStats(){totalWords.textContent=words.length;dueWords.textContent=words.filter(due).length;hardWords.textContent=words.filter(hard).length;correctCount.textContent=stats.correct||0;wrongCount.textContent=stats.wrong||0;let t=(stats.correct||0)+(stats.wrong||0);accuracy.textContent=t?Math.round(stats.correct/t*100)+'%':'0%';streak.textContent=stats.streak||1;weakTable.innerHTML=[...words].sort((a,b)=>(b.wrong||0)-(a.wrong||0)).slice(0,10).map(w=>`<tr><td>${esc(w.target)}</td><td>${esc(w.ko)}</td><td>${w.wrong||0}</td><td>${w.correct||0}</td></tr>`).join('')}function save(){saveState();renderWords();renderStats()}function switchTab(id){stopPronunciation();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));function today(){return new Date().toISOString().slice(0,10)}function markStudy(){let t=today();if(stats.lastStudy===t)return;if(stats.lastStudy){let d=Math.round((new Date(t)-new Date(stats.lastStudy))/86400000);stats.streak=d===1?(stats.streak||1)+1:1}else stats.streak=1;stats.lastStudy=t;save()}function shuffle(a){return a.sort(()=>Math.random()-.5)}function nextDate(level){let arr=[1,3,7,14,30,60],d=new Date();d.setDate(d.getDate()+arr[Math.min(level,5)]);return d.toISOString()}function startStudy(m){if(!words.length){alert('먼저 단어를 추가하세요.');return}mode=m;current=0;switchTab('study');markStudy();let d=words.filter(due);session=shuffle([...(d.length?d:words)]).slice(0,20);renderQuestion()}function renderQuestion(){stopPronunciation();if(current>=session.length){studyArea.innerHTML=`<div class="card center"><h2>🎉 복습 완료!</h2><button class="primary" onclick="startStudy('${mode}')">한 번 더</button></div>`;save();return}answered=false;let w=session[current],pct=current/session.length*100,actual=mode==='mixed'?['flash','choice','typing'][Math.floor(Math.random()*3)]:mode;if(actual==='flash')studyArea.innerHTML=`<div class="progress"><div style="width:${pct}%"></div></div><div class="flash-wrap"><div class="flash" onclick="this.classList.toggle('flipped')"><div class="face"><div class="big">${esc(w.target)}</div><div class="muted" style="margin-top:12px">눌러서 뜻 보기</div></div><div class="face back"><div class="meaning">${esc(w.ko)}</div></div></div></div><div class="row" style="justify-content:center;margin-top:13px">${pronunciationButtons(w)}<button class="danger" onclick="grade(false)">모름</button><button class="primary" onclick="grade(true)">알겠음</button></div>`;else if(actual==='choice'){let opts=[w.ko,...shuffle(words.filter(x=>x.id!==w.id).map(x=>x.ko)).slice(0,3)];opts=shuffle([...new Set(opts)]);while(opts.length<4)opts.push('모르겠음');studyArea.innerHTML=`<div class="progress"><div style="width:${pct}%"></div></div><div class="card center"><div class="small">${current+1} / ${session.length}</div><div class="question">${esc(w.target)}</div>${pronunciationButtons(w)}<div class="choices">${opts.map(o=>`<button class="choice" onclick="answerChoice(this,'${encodeURIComponent(o)}','${encodeURIComponent(w.ko)}')">${esc(o)}</button>`).join('')}</div><div id="feedback" class="feedback"></div></div>`}else studyArea.innerHTML=`<div class="progress"><div style="width:${pct}%"></div></div><div class="card center"><div class="small">${current+1} / ${session.length}</div><div class="question">${esc(w.ko)}</div>${pronunciationButtons(w)}<br><input id="typingInput" placeholder="학습 언어로 입력" style="width:100%;max-width:360px;text-align:center;font-size:20px" onkeydown="if(event.key==='Enter')answerTyping()"><br><button class="primary" style="margin-top:11px" onclick="answerTyping()">정답 확인</button><div id="feedback" class="feedback"></div></div>`}function normalize(s){return s.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function answerChoice(btn,o,a){if(answered)return;answered=true;o=decodeURIComponent(o);a=decodeURIComponent(a);document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===a)b.classList.add('correct')});let ok=o===a;if(!ok)btn.classList.add('wrong');feedback.textContent=ok?'정답입니다!':'정답: '+a;record(ok);setTimeout(next,850)}function isTypingCorrect(input,target){const actual=normalize(input),expected=normalize(target);return actual===expected||(lang==='es'&&actual===expected.replace(/^(el|la|los|las|un|una|unos|unas)\s+/,''))}function answerTyping(){if(answered||!typingInput.value.trim())return;answered=true;let w=session[current],ok=isTypingCorrect(typingInput.value,w.target);feedback.textContent=ok?'정답입니다!':'정답: '+w.target;feedback.style.color=ok?'var(--good)':'var(--bad)';record(ok);setTimeout(next,1000)}function grade(ok){record(ok);next()}function record(ok){let w=words.find(x=>x.id===session[current].id);if(ok){stats.correct++;w.correct=(w.correct||0)+1;w.level=Math.min((w.level||0)+1,5);w.nextReview=nextDate(w.level)}else{stats.wrong++;w.wrong=(w.wrong||0)+1;w.level=0;w.nextReview=nextDate(0)}saveState()}function next(){current++;renderQuestion();renderStats()}if(lang)selectLanguage(lang);
</script></body></html>
