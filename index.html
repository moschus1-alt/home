<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duolingo Spanish Vocabulary Practice</title>
<style>
:root{--g:#58cc02;--dg:#46a302;--b:#1cb0f6;--ink:#2b2b2b;--muted:#777;--line:#ddd;--bg:#f7f7f7}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
header{background:white;border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:4px}
main{max-width:1050px;margin:auto;padding:18px;display:grid;grid-template-columns:360px 1fr;gap:18px}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 2px 0 #ddd}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button,select,input{font:inherit}button{border:0;border-radius:12px;padding:10px 13px;font-weight:700;cursor:pointer}
.primary{background:var(--g);color:white}.blue{background:var(--b);color:white}.ghost{background:#eee;color:#444}.danger{background:#ff4b4b;color:white}
select,input{border:1px solid #ccc;border-radius:10px;padding:9px;background:white}
.pack{border-top:1px solid #eee;padding:10px 0}.pack label{display:flex;gap:9px;align-items:center}
.small{font-size:12px;color:var(--muted)}#packs{max-height:58vh;overflow:auto}
.bigword{font-size:38px;font-weight:800;text-align:center;margin:34px 0 10px}.meaning{text-align:center;font-size:23px;min-height:40px}
.meta{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.progress{height:12px;background:#eee;border-radius:20px;overflow:hidden}.bar{height:100%;background:var(--g);width:0}
.stat{display:flex;justify-content:space-between;margin:10px 0;font-size:14px}
@media(max-width:760px){main{grid-template-columns:1fr}.bigword{font-size:34px}#packs{max-height:38vh}}
</style>
</head>
<body>
<header><h1>🇪🇸 Duolingo Spanish Vocabulary Practice</h1>
<div class="sub">공개 Duolingo English → Spanish 어휘 데이터 전용 · 선택 상태는 이 기기에 저장됩니다.</div></header>
<main>
<section class="card">
<b>단어팩</b>
<div class="controls">
<select id="section"><option value="all">전체 Section</option></select>
<input id="search" placeholder="Skill 검색" style="flex:1;min-width:120px">
</div>
<div class="controls">
<button class="primary" id="selectVisible">현재 목록 추가</button>
<button class="danger" id="clearVisible">현재 목록 취소</button>
<button class="ghost" id="clearAll">전체 취소</button>
</div>
<div class="small" id="packSummary"></div>
<div id="packs"></div>
</section>

<section class="card">
<div class="stat"><span id="selectedCount">선택 0단어</span><span id="position">0 / 0</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="bigword" id="term">단어팩을 선택하세요</div>
<div class="meaning" id="meaning"></div>
<div class="meta" id="meta"></div>
<div class="controls" style="justify-content:center;margin-top:28px">
<button class="ghost" id="prev">← 이전</button>
<button class="blue" id="reveal">뜻 보기</button>
<button class="primary" id="next">다음 →</button>
</div>
<div class="controls" style="justify-content:center">
<button class="ghost" id="shuffle">🔀 섞기</button>
<button class="ghost" id="speak">🔊 발음</button>
</div>
</section>
</main>
<script>
let data, skills=[], selected=new Set(JSON.parse(localStorage.getItem("duoSelectedSkills")||"[]")), deck=[], pos=0, revealed=false;
const $=id=>document.getElementById(id);
fetch("duolingo_spanish_public_master.json").then(r=>r.json()).then(d=>{data=d; buildSkills(); render();});

function buildSkills(){
 const map=new Map();
 data.words.forEach(w=>{
   (w.skills||[]).forEach((s,i)=>{
     const id=(w.skill_ids||[])[i]||s;
     if(!map.has(id)) map.set(id,{id,name:s,section:w.first_section||0,count:0});
     map.get(id).count++;
   });
 });
 skills=[...map.values()].sort((a,b)=>(a.section-b.section)||a.name.localeCompare(b.name));
 [...new Set(skills.map(x=>x.section))].sort((a,b)=>a-b).forEach(s=>$("section").insertAdjacentHTML("beforeend",`<option value="${s}">Section ${s}</option>`));
}
function visibleSkills(){
 const sec=$("section").value,q=$("search").value.toLowerCase().trim();
 return skills.filter(s=>(sec==="all"||String(s.section)===sec)&&(!q||s.name.toLowerCase().includes(q)));
}
function renderPacks(){
 const list=visibleSkills();
 $("packs").innerHTML=list.map(s=>`<div class="pack"><label><input type="checkbox" data-id="${s.id}" ${selected.has(s.id)?"checked":""}><span><b>${escapeHtml(s.name)}</b><br><span class="small">Section ${s.section} · ${s.count} 연결 단어</span></span></label></div>`).join("");
 $("packs").querySelectorAll("input").forEach(el=>el.onchange=()=>{el.checked?selected.add(el.dataset.id):selected.delete(el.dataset.id); save(); rebuildDeck();});
 $("packSummary").textContent=`표시 ${list.length}개 Skill · 선택 ${selected.size}개 Skill`;
}
function rebuildDeck(){
 const seen=new Set();
 deck=data.words.filter(w=>{
   const ok=(w.skill_ids||[]).some(id=>selected.has(id));
   if(!ok||seen.has(w.term)) return false; seen.add(w.term); return true;
 });
 pos=Math.min(pos,Math.max(0,deck.length-1)); revealed=false; renderCard();
}
function renderCard(){
 $("selectedCount").textContent=`선택 ${deck.length.toLocaleString()}단어`;
 if(!deck.length){$("term").textContent="단어팩을 선택하세요";$("meaning").textContent="";$("meta").textContent="";$("position").textContent="0 / 0";$("bar").style.width="0%";return}
 const w=deck[pos]; $("term").textContent=w.term; $("meaning").textContent=revealed?(w.meanings_en||[]).join(" · "):"";
 $("meta").textContent=`Section ${w.first_section} · ${w.first_skill}`;
 $("position").textContent=`${pos+1} / ${deck.length}`;$("bar").style.width=((pos+1)/deck.length*100)+"%";
}
function save(){localStorage.setItem("duoSelectedSkills",JSON.stringify([...selected]));renderPacks()}
function render(){renderPacks();rebuildDeck()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("section").onchange=renderPacks;$("search").oninput=renderPacks;
$("selectVisible").onclick=()=>{visibleSkills().forEach(s=>selected.add(s.id));save();rebuildDeck()};
$("clearVisible").onclick=()=>{visibleSkills().forEach(s=>selected.delete(s.id));save();rebuildDeck()};
$("clearAll").onclick=()=>{selected.clear();save();rebuildDeck()};
$("reveal").onclick=()=>{revealed=true;renderCard()};
$("next").onclick=()=>{if(deck.length){pos=(pos+1)%deck.length;revealed=false;renderCard()}};
$("prev").onclick=()=>{if(deck.length){pos=(pos-1+deck.length)%deck.length;revealed=false;renderCard()}};
$("shuffle").onclick=()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}pos=0;revealed=false;renderCard()};
$("speak").onclick=()=>{if(deck.length&&"speechSynthesis"in window){let u=new SpeechSynthesisUtterance(deck[pos].term);u.lang="es-ES";speechSynthesis.cancel();speechSynthesis.speak(u)}};
</script>
</body></html>
