<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff">
<title>스페인어 단어연습</title><style>
:root{--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--ink:#3c3c3c;--muted:#777;--line:#e5e5e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{height:56px;border-bottom:2px solid #eee;display:flex;align-items:center;padding:0 15px;position:sticky;top:0;background:#fff;z-index:10}header b{font-size:17px}.app{max-width:680px;margin:auto;padding:15px}
.label{font-size:12px;font-weight:900;color:#888;margin:6px 2px}select{appearance:none;width:100%;height:50px;border:2px solid #ddd;border-radius:14px;padding:0 40px 0 13px;background:#fff;font-size:16px;font-weight:800}
.topic{margin:11px 0;padding:12px;background:#f4f4f4;border-radius:13px;font-weight:800}.apply{width:100%;height:49px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 var(--gd);margin:4px 0 14px}
.note{font-size:11px;color:#888;line-height:1.45;margin-bottom:14px}.stats{display:flex;justify-content:space-between;font-size:12px;color:#888}.progress{height:11px;background:#eee;border-radius:99px;overflow:hidden;margin:7px 0 13px}.bar{height:100%;background:var(--g)}
.card{height:min(48vh,390px);min-height:300px;border:2px solid #e7e7e7;border-radius:22px;box-shadow:0 4px 0 #e7e7e7;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;touch-action:pan-y;user-select:none;transition:transform .16s ease,opacity .16s ease;background:#fff}
.word{font-size:clamp(38px,12vw,56px);font-weight:900;text-align:center;word-break:break-word}.meaning{font-size:23px;font-weight:750;text-align:center;line-height:1.35;margin-top:20px}.hint{font-size:11px;color:#aaa;margin-top:18px}.meta{font-size:11px;color:#aaa;margin-top:7px;text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.actions button{height:46px;border:0;border-radius:13px;background:#eee;font-weight:850}.card.left{transform:translateX(-35px);opacity:.3}.card.right{transform:translateX(35px);opacity:.3}
@media(min-width:760px){body{background:#fafafa}.app{background:white;margin-top:18px;border:2px solid #eee;border-radius:20px;padding:22px}}

.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0 13px}.mode button{height:43px;border:2px solid #ddd;border-radius:13px;background:#fff;font-weight:850}.mode button.on{border-color:var(--g);background:#f4ffeb;color:#3d8e00}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.rate button{height:49px;border:0;border-radius:14px;font-size:15px;font-weight:900}.again{background:#ffeded;color:#ea2b2b}.known{background:#eaffdc;color:#3d9700}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.pill{background:#f5f5f5;border-radius:12px;padding:9px 5px;text-align:center}.pill b{display:block;font-size:18px}.pill span{font-size:10px;color:#888}
</style></head><body><header><b>🇪🇸 한국어 → 스페인어 단어연습</b></header><div class="app">
<div class="label">SECTION</div><select id="section"></select><div class="label">UNIT</div><select id="unit"></select><div class="topic" id="topic"></div>
<div class="mode"><button id="unitOnly" class="on">이 Unit만</button><button id="cumulative">여기까지 누적</button></div>
<div class="summary"><div class="pill"><b id="knownN">0</b><span>외운 단어</span></div><div class="pill"><b id="againN">0</b><span>복습 단어</span></div><div class="pill"><b id="rateN">0%</b><span>학습률</span></div></div>
<button class="apply" id="apply">이 Unit 단어 학습하기</button><div class="note" id="mappingNote">Unit 주제와 단어 의미를 비교해 우선 배치합니다. 공식 Duolingo Unit별 단어목록이 아닌 학습용 근사 매칭입니다.</div>
<div class="stats"><span id="count">0개</span><span id="pos">0 / 0</span></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="card" id="card"><div class="word" id="word">Unit을 선택하세요</div><div class="meaning" id="meaning"></div><div class="hint" id="hint">카드를 탭하면 한국어 뜻 · 좌우 스와이프로 이동</div><div class="meta" id="meta"></div></div>
<div class="rate"><button class="again" id="again">↻ 다시 볼래요</button><button class="known" id="known">✓ 외웠어요</button></div>
<div class="actions"><button id="shuffle">🔀 섞기</button><button id="speak">🔊 발음 듣기</button></div></div>
<script>
let D,C,sec=+(localStorage.getItem("krEsSec")||1),unit=+(localStorage.getItem("krEsUnit")||1),deck=[],i=0,reveal=false,startX=0,startY=0;
let mode=localStorage.getItem("krEsMode")||"unit", progress=JSON.parse(localStorage.getItem("krEsProgress")||"{}");
const $=x=>document.getElementById(x);
Promise.all([fetch("duolingo_spanish_public_master_ko_v5.json").then(r=>r.json()),fetch("korean_spanish_course_map.json").then(r=>r.json())]).then(([d,c])=>{D=d;C=c;sections();units();apply()});
function sections(){$("section").innerHTML=C.sections.map(s=>`<option value="${s.section}">Section ${s.section} · ${s.cefr} · ${s.units} Units</option>`).join("");$("section").value=sec;$("section").onchange=()=>{sec=+$("section").value;unit=1;units()}}
function units(){let s=C.sections.find(x=>x.section==sec);$("unit").innerHTML=Array.from({length:s.units},(_,k)=>`<option value="${k+1}">Unit ${k+1}</option>`).join("");unit=Math.min(unit,s.units);$("unit").value=unit;topic();$("unit").onchange=()=>{unit=+$("unit").value;topic()}}
function title(){return (C.verified_unit_titles[String(sec)]||[])[unit-1]}
function topic(){let t=title(),s=C.sections.find(x=>x.section==sec);$("topic").textContent=t?`Unit ${unit} · ${t}`:`Unit ${unit} · ${s.desc}`}
function unitTerms(s,u){return C.semantic_unit_word_map?.[`${s}-${u}`]||[]}
function goodMap(){return new Map(D.words.filter(w=>!(w.meanings_ko||[]).some(x=>x.startsWith("[검수 필요]"))).map(w=>[w.term,w]))}
function apply(){
 localStorage.setItem("krEsSec",sec);localStorage.setItem("krEsUnit",unit);localStorage.setItem("krEsMode",mode);
 let map=goodMap(),terms=[];
 if(mode==="unit") terms=unitTerms(sec,unit);
 else{
   for(let ss=1;ss<=sec;ss++){let max=ss<sec?C.sections.find(x=>x.section==ss).units:unit;for(let uu=1;uu<=max;uu++)terms.push(...unitTerms(ss,uu))}
   terms=[...new Set(terms)]
 }
 if(terms.length){deck=terms.map(t=>map.get(t)).filter(Boolean)}
 else{
   let good=[...map.values()],total=C.sections.reduce((a,s)=>a+s.units,0),before=0;
   for(let x of C.sections){if(x.section<sec)before+=x.units;else if(x.section==sec){before+=unit;break}}
   let center=Math.floor(good.length*before/total),size=28;deck=good.slice(Math.max(0,center-size),Math.min(good.length,center))
 }
 // review words first, then unseen, then known
 deck.sort((a,b)=>rank(a)-rank(b));i=0;reveal=false;updateMode();card();stats()
}
function rank(w){let p=progress[w.term];return p==="again"?0:p==="known"?2:1}
function saveProgress(){localStorage.setItem("krEsProgress",JSON.stringify(progress));stats()}
function stats(){
 let vals=Object.values(progress),kn=vals.filter(x=>x==="known").length,ag=vals.filter(x=>x==="again").length;
 $("knownN").textContent=kn;$("againN").textContent=ag;$("rateN").textContent=(kn+ag?Math.round(kn/(kn+ag)*100):0)+"%"
}
function updateMode(){$("unitOnly").classList.toggle("on",mode==="unit");$("cumulative").classList.toggle("on",mode==="cum")}
function card(){if(!deck.length){$("word").textContent="학습 가능한 단어가 없습니다";return}let w=deck[i];$("word").textContent=w.term;$("meaning").textContent=reveal?(w.meanings_ko||[]).join(" · "):"";$("meta").textContent=reveal?`공개 어휘 Skill · ${w.first_skill}${progress[w.term]?` · ${progress[w.term]==="known"?"✓ 외움":"↻ 복습"}`:""}`:"";$("count").textContent=`${deck.length}개`;$("pos").textContent=`${i+1} / ${deck.length}`;$("bar").style.width=(i+1)/deck.length*100+"%"}
function move(n){if(!deck.length)return;i=(i+n+deck.length)%deck.length;reveal=false;card()}
$("apply").onclick=apply;
$("unitOnly").onclick=()=>{mode="unit";apply()};$("cumulative").onclick=()=>{mode="cum";apply()};
$("known").onclick=()=>{if(deck.length){progress[deck[i].term]="known";saveProgress();move(1)}};
$("again").onclick=()=>{if(deck.length){progress[deck[i].term]="again";saveProgress();move(1)}};$("shuffle").onclick=()=>{deck.sort(()=>Math.random()-.5);i=0;reveal=false;card()};$("speak").onclick=()=>{if(deck.length){let u=new SpeechSynthesisUtterance(deck[i].term);u.lang="es-ES";speechSynthesis.cancel();speechSynthesis.speak(u)}};
$("card").onclick=e=>{if(Math.abs((e.clientX||0)-startX)<12){reveal=!reveal;card()}};
$("card").addEventListener("touchstart",e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});
$("card").addEventListener("touchend",e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){let c=$("card");c.classList.add(dx<0?"left":"right");setTimeout(()=>{c.classList.remove("left","right");move(dx<0?1:-1)},130)}},{passive:true});
let md=false;$("card").addEventListener("mousedown",e=>{md=true;startX=e.clientX});$("card").addEventListener("mouseup",e=>{if(!md)return;md=false;let dx=e.clientX-startX;if(Math.abs(dx)>70)move(dx<0?1:-1)});
</script></body></html>
